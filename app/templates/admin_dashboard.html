{% extends "base.html" %}
{% block title %}Panel Admin — {{ nama_toko }}{% endblock %}

{% block content %}
<h1>Panel Admin — Kelola Produk</h1>
<div id="admin-check"></div>

<div id="admin-content" style="display: none;">
    <div class="form-box" style="max-width: 600px; margin: 1rem 0;">
        <h2>Tambah Produk Baru</h2>
        <form id="tambah-produk-form">
            <label for="p-nama">Nama Produk</label>
            <input type="text" id="p-nama" required>

            <label for="p-deskripsi">Deskripsi Produk</label>
            <textarea id="p-deskripsi" rows="2" placeholder="Informasi singkat tentang produk"></textarea>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="p-harga">Harga (Rp)</label>
                    <input type="number" id="p-harga" required min="0">
                </div>
                <div>
                    <label for="p-stok">Stok</label>
                    <input type="number" id="p-stok" required min="0">
                </div>
            </div>

            <label for="p-kategori">Kategori</label>
            <input type="text" id="p-kategori" placeholder="mis. Salome, Minuman, Snak">

            <label for="p-foto">Upload Foto</label>
            <input type="file" id="p-foto" accept="image/png, image/jpeg, image/webp">
            <img id="p-foto-preview" style="display:none; max-width:120px; margin-top:0.5rem; border-radius:6px;">

            <label for="p-gambar">Atau tempel URL Foto (opsional)</label>
            <input type="text" id="p-gambar" placeholder="https://domain.com/gambar.jpg">
            <p style="font-size:0.8rem; color:#666; margin-top:0.2rem;">Kalau upload foto diisi, URL ini diabaikan.</p>

            <div style="display: flex; gap: 1.5rem; margin: 1rem 0;">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="p-ready" checked> Status Ready
                </label>
                <label style="cursor: pointer;">
                    <input type="checkbox" id="p-po"> Pre-Order (PO)
                </label>
            </div>

            <button type="submit">➕ Tambah Produk</button>
        </form>
        <p id="form-msg" class="error"></p>
    </div>

    <h2>Daftar Produk</h2>
    <div id="daftar-produk">Memuat...</div>
</div>

<div id="edit-modal" style="display:none; position: fixed; top: 0; left: 0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center;">
    <div class="form-box" style="background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;">
        <h2>Edit Produk</h2>
        <input type="hidden" id="edit-id">

        <label for="edit-nama">Nama Produk</label>
        <input type="text" id="edit-nama" required>

        <label for="edit-deskripsi">Deskripsi Produk</label>
        <textarea id="edit-deskripsi" rows="2"></textarea>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
                <label for="edit-harga">Harga (Rp)</label>
                <input type="number" id="edit-harga" required min="0">
            </div>
            <div>
                <label for="edit-stok">Stok</label>
                <input type="number" id="edit-stok" required min="0">
            </div>
        </div>

        <label for="edit-kategori">Kategori</label>
        <input type="text" id="edit-kategori">

        <label for="edit-foto">Ganti Foto (opsional)</label>
        <input type="file" id="edit-foto" accept="image/png, image/jpeg, image/webp">
        <img id="edit-foto-preview" style="display:none; max-width:120px; margin-top:0.5rem; border-radius:6px;">

        <label for="edit-gambar">URL Foto Saat Ini</label>
        <input type="text" id="edit-gambar">

        <div style="display: flex; gap: 1.5rem; margin: 1rem 0;">
            <label style="cursor: pointer;">
                <input type="checkbox" id="edit-ready"> Status Ready
            </label>
            <label style="cursor: pointer;">
                <input type="checkbox" id="edit-po"> Pre-Order (PO)
            </label>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button onclick="simpanEditProduk()" style="flex: 1;">💾 Simpan Perubahan</button>
            <button onclick="tutupEditModal()" style="background: #6c757d; flex: 1;">Batal</button>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
const token = localStorage.getItem("access_token");
const PER_HALAMAN = 10;
let halamanProduk = 1;

async function uploadFoto(fileInputEl) {
    if (!fileInputEl.files || !fileInputEl.files[0]) return null;
    const formData = new FormData();
    formData.append("file", fileInputEl.files[0]);

    const res = await fetch("/produk/upload-foto", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: formData,
    });

    if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Gagal upload foto");
    }
    const data = await res.json();
    return data.gambar_url;
}

document.getElementById("p-foto").addEventListener("change", (e) => {
    const preview = document.getElementById("p-foto-preview");
    if (e.target.files && e.target.files[0]) {
        preview.src = URL.createObjectURL(e.target.files[0]);
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }
});

document.getElementById("edit-foto").addEventListener("change", (e) => {
    const preview = document.getElementById("edit-foto-preview");
    if (e.target.files && e.target.files[0]) {
        preview.src = URL.createObjectURL(e.target.files[0]);
        preview.style.display = "block";
    }
});

async function cekAdmin() {
    const checkDiv = document.getElementById("admin-check");
    if (!token) {
        checkDiv.innerHTML = '<p>Silakan <a href="/login">login</a> dulu.</p>';
        return false;
    }
    const res = await fetch("/auth/me", { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) {
        checkDiv.innerHTML = '<p>Sesi habis, silakan <a href="/login">login</a> lagi.</p>';
        return false;
    }
    const user = await res.json();
    if (!user.is_admin) {
        checkDiv.innerHTML = "<p>Akses ditolak — halaman ini khusus admin.</p>";
        return false;
    }
    document.getElementById("admin-content").style.display = "block";
    return true;
}

async function muatProduk() {
    const container = document.getElementById("daftar-produk");
    const skip = (halamanProduk - 1) * PER_HALAMAN;
    const res = await fetch(`/produk/?skip=${skip}&limit=${PER_HALAMAN}`);
    const produkList = await res.json();

    if (!produkList.length && halamanProduk > 1) {
        halamanProduk -= 1;
        return muatProduk();
    }

    if (!produkList.length) {
        container.innerHTML = "<p>Belum ada produk.</p>";
        return;
    }

    let html = `
        <table class="keranjang-table" style="width: 100%; border-collapse: collapse;">
            <tr>
                <th>Foto</th>
                <th>Nama</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>`;

    for (const p of produkList) {
        const fotoHtml = p.gambar_url
            ? `<img src="${p.gambar_url}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">`
            : '❌';

        let statusBadge = p.is_po
            ? '⏳ PO'
            : (p.is_ready ? '✅ Ready' : '❌ Habis');

        html += `<tr>
            <td style="text-align:center;">${fotoHtml}</td>
            <td><strong>${p.nama}</strong><br><small style="color:#666;">${p.kategori || '-'}</small></td>
            <td>Rp${p.harga.toLocaleString("id-ID")}</td>
            <td>${p.stok}</td>
            <td>${statusBadge}</td>
            <td>
                <button onclick='bukaEditModal(${JSON.stringify(p)})'>✏️ Edit</button>
                <button onclick="hapusProduk(${p.id})" style="background:#dc3545; color: white;">🗑️ Hapus</button>
            </td>
        </tr>`;
    }
    html += "</table>";

    html += `
    <div class="pagination">
        <button type="button" onclick="gantiHalamanProduk(-1)" ${halamanProduk <= 1 ? "disabled" : ""}>◀ Sebelumnya</button>
        <span class="pagination-info">Halaman ${halamanProduk}</span>
        <button type="button" onclick="gantiHalamanProduk(1)" ${produkList.length < PER_HALAMAN ? "disabled" : ""}>Berikutnya ▶</button>
    </div>`;

    container.innerHTML = html;
}

function gantiHalamanProduk(arah) {
    halamanProduk += arah;
    if (halamanProduk < 1) halamanProduk = 1;
    muatProduk();
}

function bukaEditModal(p) {
    document.getElementById("edit-id").value = p.id;
    document.getElementById("edit-nama").value = p.nama;
    document.getElementById("edit-deskripsi").value = p.deskripsi || "";
    document.getElementById("edit-harga").value = p.harga;
    document.getElementById("edit-stok").value = p.stok;
    document.getElementById("edit-kategori").value = p.kategori || "";
    document.getElementById("edit-gambar").value = p.gambar_url || "";
    document.getElementById("edit-ready").checked = p.is_ready ?? true;
    document.getElementById("edit-po").checked = p.is_po ?? false;

    document.getElementById("edit-foto").value = "";
    const preview = document.getElementById("edit-foto-preview");
    if (p.gambar_url) {
        preview.src = p.gambar_url;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }

    document.getElementById("edit-modal").style.display = "flex";
}

function tutupEditModal() {
    document.getElementById("edit-modal").style.display = "none";
}

async function simpanEditProduk() {
    const id = document.getElementById("edit-id").value;

    let gambarUrl = document.getElementById("edit-gambar").value || null;
    try {
        const hasilUpload = await uploadFoto(document.getElementById("edit-foto"));
        if (hasilUpload) gambarUrl = hasilUpload;
    } catch (err) {
        showToast(err.message, "error");
        return;
    }

    const body = {
        nama: document.getElementById("edit-nama").value,
        deskripsi: document.getElementById("edit-deskripsi").value || null,
        harga: parseFloat(document.getElementById("edit-harga").value),
        stok: parseInt(document.getElementById("edit-stok").value),
        kategori: document.getElementById("edit-kategori").value || null,
        gambar_url: gambarUrl,
        is_ready: document.getElementById("edit-ready").checked,
        is_po: document.getElementById("edit-po").checked
    };

    const res = await fetch(`/produk/${id}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });

    if (res.ok) {
        showToast("Produk berhasil diperbarui!");
        tutupEditModal();
        muatProduk();
    } else {
        showToast("Gagal memperbarui produk", "error");
    }
}

async function hapusProduk(produkId) {
    if (!confirm("Apakah Anda yakin ingin menghapus produk ini?")) return;
    const res = await fetch(`/produk/${produkId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
    });
    if (res.ok) {
        showToast("Produk berhasil dihapus!");
    } else {
        showToast("Gagal menghapus produk", "error");
    }
    muatProduk();
}

document.getElementById("tambah-produk-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("form-msg");
    msg.textContent = "";

    let gambarUrl = document.getElementById("p-gambar").value || null;
    try {
        const hasilUpload = await uploadFoto(document.getElementById("p-foto"));
        if (hasilUpload) gambarUrl = hasilUpload;
    } catch (err) {
        msg.textContent = err.message;
        return;
    }

    const body = {
        nama: document.getElementById("p-nama").value,
        deskripsi: document.getElementById("p-deskripsi").value || null,
        harga: parseFloat(document.getElementById("p-harga").value),
        stok: parseInt(document.getElementById("p-stok").value),
        kategori: document.getElementById("p-kategori").value || null,
        gambar_url: gambarUrl,
        is_ready: document.getElementById("p-ready").checked,
        is_po: document.getElementById("p-po").checked
    };

    const res = await fetch("/produk/", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body),
    });

    if (!res.ok) {
        const err = await res.json();
        msg.textContent = err.detail || "Gagal menambah produk";
        return;
    }

    showToast("Produk berhasil ditambahkan!");
    document.getElementById("tambah-produk-form").reset();
    document.getElementById("p-ready").checked = true;
    document.getElementById("p-foto-preview").style.display = "none";
    halamanProduk = 1;
    muatProduk();
});

(async () => {
    if (await cekAdmin()) muatProduk();
})();
</script>
{% endblock %}
