{% extends "base.html" %}
{% block title %}Daftar — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box" id="halaman-auth" data-google-client-id="{{ google_client_id }}" data-facebook-app-id="{{ facebook_app_id }}">
    <h1>Daftar Akun</h1>

    <div class="login-sosial">
        <div id="g-btn-daftar"></div>
        <button type="button" id="btn-facebook-daftar" class="btn-sosial btn-facebook">
            <span class="btn-sosial-ikon">f</span> Daftar dengan Facebook
        </button>
    </div>

    <div class="pembatas-atau"><span>atau</span></div>

    <div class="tab-daftar">
        <button type="button" id="tab-email" class="aktif">Pakai Email</button>
        <button type="button" id="tab-telepon">Pakai No. HP</button>
    </div>

    <form id="register-form">
        <label>Nama</label>
        <input type="text" id="nama" required>
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Password</label>
        <input type="password" id="password" required minlength="8">
        <button type="submit">Daftar</button>
    </form>

    <form id="register-form-telepon" class="tersembunyi">
        <label>Nama</label>
        <input type="text" id="tp-nama" required>
        <label>No. HP</label>
        <input type="tel" id="tp-telepon" placeholder="081234567890" required>
        <label>Password</label>
        <input type="password" id="tp-password" required minlength="8">
        <button type="submit">Daftar</button>
    </form>

    <p id="error-msg" class="error"></p>
    <p>Sudah punya akun? <a href="/login">Login</a></p>
</div>
{% endblock %}

{% block script %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/static/js/register.js?v=1"></script>
{% endblock %}
