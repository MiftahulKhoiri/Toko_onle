{% extends "base.html" %}
{% block title %}Reset Password — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box">
    <h1>Bikin Password Baru</h1>

    <form id="reset-password-form">
        <label>Password Baru</label>
        <input type="password" id="password-baru" minlength="8" required>
        <label>Ulangi Password Baru</label>
        <input type="password" id="password-ulang" minlength="8" required>
        <button type="submit" id="reset-btn">Simpan Password Baru</button>
    </form>

    <p id="pesan" class="error"></p>
    <p><a href="/login">Kembali ke Login</a></p>
</div>
{% endblock %}

{% block script %}
<script src="/static/js/reset_password.js?v=1"></script>
{% endblock %}
