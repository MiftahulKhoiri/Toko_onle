<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ nama_toko }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body>
    <header class="navbar">
        <div class="navbar-top">
            <a href="/" class="brand">🍢 {{ nama_toko }}</a>
            <span id="nav-auth"></span>
        </div>
        <nav class="navbar-bottom">
            <a href="/">🍜 Produk</a>
            <a href="/keranjang-saya">🛒 Keranjang <span id="cart-badge" class="cart-badge"></span></a>
            <a href="/pesanan-saya">📦 Pesanan Saya</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; {{ nama_toko }} — Bakso legen sejak (2015).</p>
    </footer>

    <script src="/static/js/main.js?v=3"></script>
    {% block script %}{% endblock %}
</body>
</html>
