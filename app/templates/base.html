<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ nama_toko }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">
            <span class="logo">🍢</span>
            <span class="brand-name">{{ nama_toko }}</span>
        </a>

        <nav class="nav-links">
            <a href="/">Produk</a>
            <a href="/keranjang-saya">Keranjang</a>
            
            <div id="nav-auth" class="nav-user-container"></div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; {{ nama_toko }} — Bakso & aneka makanan lainnya.</p>
    </footer>

    <script src="/static/js/main.js"></script>
    {% block script %}{% endblock %}
</body>
</html>
