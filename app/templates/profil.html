{% extends "base.html" %}
{% block title %}Profil Saya — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box" style="max-width: 600px; margin: 2rem auto;">

    <!-- ===== TAMPILAN PROFIL (default) ===== -->
    <div id="tampilan-profil">
        <div class="profil-avatar-wrap">
            <div id="profil-avatar" class="profil-avatar">?</div>
            <h1 id="view-nama">Memuat...</h1>
            <p id="view-email" class="profil-email">-</p>
        </div>

        <div class="profil-info-list">
            <div class="profil-info-item">
                <span class="profil-info-label">📱 No. Telepon</span>
                <span id="view-telepon">-</span>
            </div>
            <div class="profil-info-item">
                <span class="profil-info-label">📍 Alamat</span>
                <span id="view-alamat-gabungan">-</span>
            </div>
        </div>

        <a href="/checkout/alamat" class="profil-kelola-alamat">🗂️ Kelola Alamat Pengiriman</a>

        <button id="btn-edit-profil" onclick="tampilkanEdit()" style="margin-top: 1.2rem; width: 100%;">✏️ Edit Profil</button>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #ddd;">

        <button onclick="logout()" style="background-color: #dc3545; color: white; width: 100%;">
            🚪 Logout / Keluar
        </button>
    </div>

    <!-- ===== FORM EDIT (disembunyikan sampai tombol Edit ditekan) ===== -->
    <div id="form-edit-profil" style="display: none;">
        <h2>Edit Data Profil</h2>
        <form id="edit-profil-form">
            <label for="edit-nama">Nama Lengkap</label>
            <input type="text" id="edit-nama" required>

            <label for="edit-email">Email</label>
            <input type="email" id="edit-email" disabled style="background-color: #eee;" title="Email tidak dapat diubah">

            <label for="edit-telepon">No. Telepon / WhatsApp</label>
            <input type="tel" id="edit-telepon" placeholder="Contoh: 08123456789">

            <h3 style="margin-top: 1.5rem; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 0.3rem;">Rincian Alamat Pengiriman</h3>

            <label for="edit-alamat-jalan">Jalan, No. Rumah, RT/RW</label>
            <textarea id="edit-alamat-jalan" rows="2" placeholder="Jl. Merdeka No. 12, RT 01/RW 02"></textarea>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="edit-kelurahan">Kelurahan / Desa</label>
                    <input type="text" id="edit-kelurahan" placeholder="Kelurahan">
                </div>
                <div>
                    <label for="edit-kecamatan">Kecamatan</label>
                    <input type="text" id="edit-kecamatan" placeholder="Kecamatan">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="edit-kota">Kota / Kabupaten</label>
                    <input type="text" id="edit-kota" placeholder="Kota / Kabupaten">
                </div>
                <div>
                    <label for="edit-provinsi">Provinsi</label>
                    <input type="text" id="edit-provinsi" placeholder="Provinsi">
                </div>
            </div>

            <label for="edit-kode-pos">Kode Pos</label>
            <input type="text" id="edit-kode-pos" placeholder="12345" style="max-width: 200px;">

            <div style="display:flex; gap:0.8rem; margin-top: 1.5rem;">
                <button type="submit" style="flex:1;">💾 Simpan Perubahan</button>
                <button type="button" onclick="tampilkanView()" style="flex:1; background:#6c757d;">Batal</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
const token = localStorage.getItem("access_token");

function tampilkanEdit() {
    document.getElementById("tampilan-profil").style.display = "none";
    document.getElementById("form-edit-profil").style.display = "block";
}

function tampilkanView() {
    document.getElementById("form-edit-profil").style.display = "none";
    document.getElementById("tampilan-profil").style.display = "block";
}

async function loadProfil() {
    if (!token) {
        window.location.href = "/login";
        return;
    }

    try {
        const res = await fetch("/auth/me", {
            headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
            localStorage.removeItem("access_token");
            window.location.href = "/login";
            return;
        }

        const user = await res.json();

        document.getElementById("view-nama").textContent = user.nama || "-";
        document.getElementById("view-email").textContent = user.email || "-";
        document.getElementById("view-telepon").textContent = user.telepon || "Belum diisi";
        document.getElementById("profil-avatar").textContent = (user.nama || "?").trim().charAt(0).toUpperCase();

        const komponenAlamat = [
            user.alamat_jalan,
            user.kelurahan ? `Kel. ${user.kelurahan}` : null,
            user.kecamatan ? `Kec. ${user.kecamatan}` : null,
            user.kota,
            user.provinsi,
            user.kode_pos
        ].filter(Boolean);

        document.getElementById("view-alamat-gabungan").textContent =
            komponenAlamat.length > 0 ? komponenAlamat.join(", ") : "Belum diisi";

        document.getElementById("edit-nama").value = user.nama || "";
        document.getElementById("edit-email").value = user.email || "";
        document.getElementById("edit-telepon").value = user.telepon || "";
        document.getElementById("edit-alamat-jalan").value = user.alamat_jalan || "";
        document.getElementById("edit-kelurahan").value = user.kelurahan || "";
        document.getElementById("edit-kecamatan").value = user.kecamatan || "";
        document.getElementById("edit-kota").value = user.kota || "";
        document.getElementById("edit-provinsi").value = user.provinsi || "";
        document.getElementById("edit-kode-pos").value = user.kode_pos || "";
    } catch (err) {
        console.error("Gagal memuat data profil", err);
    }
}

document.getElementById("edit-profil-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
        nama: document.getElementById("edit-nama").value,
        telepon: document.getElementById("edit-telepon").value || null,
        alamat_jalan: document.getElementById("edit-alamat-jalan").value || null,
        kelurahan: document.getElementById("edit-kelurahan").value || null,
        kecamatan: document.getElementById("edit-kecamatan").value || null,
        kota: document.getElementById("edit-kota").value || null,
        provinsi: document.getElementById("edit-provinsi").value || null,
        kode_pos: document.getElementById("edit-kode-pos").value || null,
    };

    try {
        const res = await fetch("/auth/me", {
            method: "PUT",
            headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            showToast("Profil berhasil diperbarui!");
            await loadProfil();
            tampilkanView();
            if (typeof renderNavAuth === "function") renderNavAuth();
        } else {
            const err = await res.json();
            showToast(err.detail || "Gagal memperbarui profil", "error");
        }
    } catch (err) {
        showToast("Terjadi kesalahan koneksi", "error");
    }
});

function logout() {
    if (confirm("Apakah kamu yakin ingin keluar?")) {
        localStorage.removeItem("access_token");
        window.location.href = "/";
    }
}

document.addEventListener("DOMContentLoaded", loadProfil);
</script>
{% endblock %}
