{% extends "base.html" %}
{% block title %}Profil Saya — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box" style="max-width: 500px; margin: 2rem auto;">
    <h1>Profil & Alamat Pengiriman</h1>
    
    <div id="identitas-container" class="profile-info" style="margin-bottom: 1.5rem;">
        <p><strong>Nama Lengkap:</strong> <span id="view-nama">Memuat...</span></p>
        <p><strong>Email:</strong> <span id="view-email">Memuat...</span></p>
        <p><strong>No. Telepon:</strong> <span id="view-telepon">-</span></p>
        <p><strong>Alamat Pengiriman:</strong> <span id="view-alamat">-</span></p>
    </div>

    <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #ddd;">

    <h2>Edit Data Profil</h2>
    <form id="edit-profil-form">
        <label for="edit-nama">Nama Lengkap</label>
        <input type="text" id="edit-nama" required>

        <label for="edit-email">Email</label>
        <input type="email" id="edit-email" disabled style="background-color: #eee;" title="Email tidak dapat diubah">

        <label for="edit-telepon">No. Telepon / WhatsApp</label>
        <input type="tel" id="edit-telepon" placeholder="Contoh: 08123456789">

        <label for="edit-alamat">Alamat Lengkap Pengiriman</label>
        <textarea id="edit-alamat" rows="3" placeholder="Jl. Merdeka No. 12, RT 01/RW 02, Kecamatan, Kota..."></textarea>

        <button type="submit" style="margin-top: 1rem;">Simpan Perubahan</button>
    </form>
    <p id="profil-msg" class="error"></p>

    <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ddd;">

    <button onclick="logout()" style="background-color: #dc3545; color: white; width: 100%;">
        🚪 Logout / Keluar
    </button>
</div>
{% endblock %}

{% block script %}
<script>
const token = localStorage.getItem("access_token");

async function loadProfil() {
    if (!token) {
        window.location.href = "/login";
        return;
    }

    try {
        const res = await fetch("/auth/me", {
            headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
            localStorage.removeItem("access_token");
            window.location.href = "/login";
            return;
        }

        const user = await res.json();
        
        // Tampilkan Identitas
        document.getElementById("view-nama").textContent = user.nama || "-";
        document.getElementById("view-email").textContent = user.email || "-";
        document.getElementById("view-telepon").textContent = user.telepon || "Belum diisi";
        document.getElementById("view-alamat").textContent = user.alamat || "Belum diisi";

        // Form Edit
        document.getElementById("edit-nama").value = user.nama || "";
        document.getElementById("edit-email").value = user.email || "";
        document.getElementById("edit-telepon").value = user.telepon || "";
        document.getElementById("edit-alamat").value = user.alamat || "";
    } catch (err) {
        console.error("Gagal memuat data profil", err);
    }
}

// Simpan Data Profil
document.getElementById("edit-profil-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("profil-msg");
    msg.textContent = "";

    const payload = {
        nama: document.getElementById("edit-nama").value,
        telepon: document.getElementById("edit-telepon").value,
        alamat: document.getElementById("edit-alamat").value
    };

    try {
        const res = await fetch("/auth/me", {
            method: "PUT",
            headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("Profil berhasil diperbarui!");
            loadProfil();
            if (typeof renderNavAuth === "function") renderNavAuth();
        } else {
            const err = await res.json();
            msg.textContent = err.detail || "Gagal memperbarui profil";
        }
    } catch (err) {
        msg.textContent = "Terjadi kesalahan koneksi";
    }
});

function logout() {
    if (confirm("Apakah kamu yakin ingin keluar?")) {
        localStorage.removeItem("access_token");
        window.location.href = "/";
    }
}

document.addEventListener("DOMContentLoaded", loadProfil);
</script>
{% endblock %}
