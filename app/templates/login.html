{% extends "base.html" %}
{% block title %}Login — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box">
    <h1>Login</h1>
    <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Password</label>
        <input type="password" id="password" required>
        <button type="submit" id="login-btn">Login</button>
    </form>
    <p id="error-msg" class="error"></p>
    <p>Belum punya akun? <a href="/register">Daftar</a></p>
</div>
{% endblock %}

{% block script %}
<script>
let hitungMundurTimer = null;

function mulaiHitungMundur(detik) {
    const errorMsg = document.getElementById("error-msg");
    const tombol = document.getElementById("login-btn");
    let sisa = detik;

    tombol.disabled = true;
    clearInterval(hitungMundurTimer);

    const tampilkan = () => {
        errorMsg.textContent = `Terlalu banyak percobaan. Coba lagi dalam ${sisa} detik.`;
    };
    tampilkan();

    hitungMundurTimer = setInterval(() => {
        sisa -= 1;
        if (sisa <= 0) {
            clearInterval(hitungMundurTimer);
            tombol.disabled = false;
            errorMsg.textContent = "";
            return;
        }
        tampilkan();
    }, 1000);
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("error-msg");
    errorMsg.textContent = "";

    try {
        const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
        });

        if (res.status === 429) {
            const retryAfter = parseInt(res.headers.get("Retry-After") || "60", 10);
            mulaiHitungMundur(retryAfter);
            return;
        }

        if (!res.ok) {
            const err = await res.json();
            errorMsg.textContent = err.detail || "Login gagal";
            return;
        }
        const data = await res.json();
        localStorage.setItem("access_token", data.access_token);
        window.location.href = "/";
    } catch (err) {
        errorMsg.textContent = "Tidak bisa terhubung ke server";
    }
});
</script>
{% endblock %}
