{% extends "base.html" %}
{% block title %}Login — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box" id="halaman-auth" data-google-client-id="{{ google_client_id }}" data-facebook-app-id="{{ facebook_app_id }}">
    <h1>Login</h1>

    <div class="login-sosial">
        <div id="g-btn-login"></div>
        <button type="button" id="btn-facebook-login" class="btn-sosial btn-facebook">
            <span class="btn-sosial-ikon">f</span> Masuk dengan Facebook
        </button>
    </div>

    <div class="pembatas-atau"><span>atau</span></div>

    <div class="tab-daftar">
        <button type="button" id="tab-email" class="aktif">Pakai Email</button>
        <button type="button" id="tab-telepon">Pakai No. HP</button>
    </div>

    <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Password</label>
        <input type="password" id="password" required>
        <button type="submit" id="login-btn">Login</button>
    </form>

    <form id="login-form-telepon" class="tersembunyi">
        <label>No. HP</label>
        <input type="tel" id="tp-telepon" placeholder="081234567890" required>
        <label>Password</label>
        <input type="password" id="tp-password" required>
        <button type="submit" id="login-btn-telepon">Login</button>
    </form>

    <p id="error-msg" class="error"></p>
    <p><a href="/lupa-password">Lupa password?</a></p>
    <p>Belum punya akun? <a href="/register">Daftar</a></p>
</div>
{% endblock %}

{% block script %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/static/js/login.js?v=1"></script>
{% endblock %}
