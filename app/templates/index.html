{% extends "base.html" %}
{% block title %}{{ nama_toko }} — Produk{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/index.css?v=1">
{% endblock %}

{% block content %}
<h1>Menu {{ nama_toko }}</h1>

<div class="tab-urutan" id="tab-urutan">
    <button type="button" class="tab-aktif" data-urutan="semua" onclick="gantiUrutan('semua')">Semua Produk</button>
    <button type="button" data-urutan="terbaru" onclick="gantiUrutan('terbaru')">Terbaru</button>
    <button type="button" data-urutan="terlaris" onclick="gantiUrutan('terlaris')">Terlaris</button>
</div>

<input
    type="search"
    id="cari-produk"
    class="cari-produk"
    placeholder="Cari menu... (mis. bakso, tahu)"
    oninput="filterProduk()"
    autocomplete="off"
>

<div class="produk-grid" id="produk-grid"><p>Memuat menu...</p></div>
<p id="cari-kosong" class="cari-kosong">Produk yang kamu cari nggak ketemu, coba kata kunci lain.</p>
{% endblock %}

{% block script %}
<script src="/static/js/index.js?v=1"></script>
{% endblock %}
