{% extends "base.html" %}
{% block title %}Lupa Password — {{ nama_toko }}{% endblock %}

{% block content %}
<div class="form-box">
    <h1>Lupa Password</h1>
    <p style="font-size:0.85rem;color:#6b5a49;">Masukkan email akun kamu, nanti kami kirimkan link buat bikin password baru.</p>

    <form id="lupa-password-form">
        <label>Email</label>
        <input type="email" id="email" required>
        <button type="submit" id="kirim-btn">Kirim Link Reset</button>
    </form>

    <p id="pesan" class="error"></p>
    <p><a href="/login">Kembali ke Login</a></p>
</div>
{% endblock %}

{% block script %}
<script>
const form = document.getElementById("lupa-password-form");
const pesan = document.getElementById("pesan");
const tombol = document.getElementById("kirim-btn");

// ---------- Hitung mundur kalau kena rate-limit (sama pola-nya kayak login.html) ----------
let hitungMundurTimer = null;

function mulaiHitungMundur(detik) {
    let sisa = detik;
    tombol.disabled = true;
    clearInterval(hitungMundurTimer);

    const tampilkan = () => {
        pesan.style.color = "";
        pesan.textContent = `Terlalu banyak percobaan. Coba lagi dalam ${sisa} detik.`;
    };
    tampilkan();

    hitungMundurTimer = setInterval(() => {
        sisa -= 1;
        if (sisa <= 0) {
            clearInterval(hitungMundurTimer);
            tombol.disabled = false;
            pesan.textContent = "";
            return;
        }
        tampilkan();
    }, 1000);
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    pesan.style.color = "";
    pesan.textContent = "";

    try {
        const res = await fetch("/auth/lupa-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
        });

        if (res.status === 429) {
            const retryAfter = parseInt(res.headers.get("Retry-After") || "60", 10);
            mulaiHitungMundur(retryAfter);
            return;
        }

        const data = await res.json();
        if (!res.ok) {
            pesan.textContent = formatErrorDetail(data.detail) || "Gagal mengirim link reset";
            return;
        }

        pesan.style.color = "#2e7d32";
        pesan.textContent = data.detail;
        form.reset();
    } catch (err) {
        pesan.textContent = "Tidak bisa terhubung ke server";
    }
});
</script>
{% endblock %}
