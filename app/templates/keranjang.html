{% extends "base.html" %}
{% block title %}Keranjang — {{ nama_toko }}{% endblock %}

{% block content %}
<h1>Keranjang Belanja</h1>
<p id="keranjang-msg" class="error"></p>
<div id="keranjang-isi">Memuat...</div>
{% endblock %}

{% block script %}
<script>
async function muatKeranjang() {
    const token = localStorage.getItem("access_token");
    const container = document.getElementById("keranjang-isi");

    if (!token) {
        container.innerHTML = '<p>Silakan <a href="/login">login</a> dulu buat lihat keranjang.</p>';
        return;
    }

    const res = await fetch("/keranjang/", { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) {
        container.innerHTML = '<p>Gagal memuat keranjang. Coba login ulang.</p>';
        return;
    }
    const cart = await res.json();

    if (!cart.items.length) {
        container.innerHTML = '<p>Keranjang masih kosong. <a href="/">Yuk pilih menu dulu</a>.</p>';
        return;
    }

    let html = '<table class="keranjang-table"><tr><th>Foto</th><th>Produk</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th><th></th></tr>';
    for (const item of cart.items) {
        const subtotal = item.harga_saat_beli * item.jumlah;
        const foto = item.produk && item.produk.gambar_url
            ? `<img src="${item.produk.gambar_url}" class="keranjang-thumb">`
            : `<div class="keranjang-thumb keranjang-thumb-kosong">🥣</div>`;

        html += `<tr>
            <td>${foto}</td>
            <td>${item.produk ? item.produk.nama : "-"}</td>
            <td class="mono">Rp${item.harga_saat_beli.toLocaleString("id-ID")}</td>
            <td>
                <div class="stepper">
                    <button type="button" onclick="ubahJumlah(${item.id}, ${item.produk_id}, ${item.jumlah - 1})" ${item.jumlah <= 1 ? "disabled" : ""}>−</button>
                    <span>${item.jumlah}</span>
                    <button type="button" onclick="ubahJumlah(${item.id}, ${item.produk_id}, ${item.jumlah + 1})">+</button>
                </div>
            </td>
            <td class="mono">Rp${subtotal.toLocaleString("id-ID")}</td>
            <td><button onclick="hapusItem(${item.id})">Hapus</button></td>
        </tr>`;
    }
    html += `</table>
        <p class="total">Total: Rp${cart.total_harga.toLocaleString("id-ID")}</p>
        <button onclick="checkout()">Checkout</button>`;
    container.innerHTML = html;
}

async function ubahJumlah(itemId, produkId, jumlahBaru) {
    const msg = document.getElementById("keranjang-msg");
    msg.textContent = "";

    if (jumlahBaru < 1) return; // turun di bawah 1 pakai tombol Hapus, bukan stepper

    const token = localStorage.getItem("access_token");
    const res = await fetch(`/keranjang/items/${itemId}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ produk_id: produkId, jumlah: jumlahBaru }),
    });

    if (!res.ok) {
        const err = await res.json();
        msg.textContent = err.detail || "Gagal mengubah jumlah";
    }

    muatKeranjang();
    updateCartBadge();
}

async function hapusItem(itemId) {
    const token = localStorage.getItem("access_token");
    await fetch(`/keranjang/items/${itemId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
    });
    muatKeranjang();
    updateCartBadge();
}

async function checkout() {
    const token = localStorage.getItem("access_token");
    const res = await fetch("/payment/checkout", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) {
        const err = await res.json();
        alert(err.detail || "Checkout gagal");
        return;
    }
    const data = await res.json();
    window.location.href = data.redirect_url;
}

muatKeranjang();
</script>
{% endblock %}
